  <path d="M408 58 C414 92 428 106 462 112 C428 118 414 132 408 166 C402 132 388 118 354 112 C388 106 402 92 408 58 Z" fill="url(#spark)" stroke="#1c2884" stroke-width="6" stroke-linejoin="round"/>

    <rect x="196" y="186" width="28" height="120" rx="14"/>
    <rect x="244" y="160" width="28" height="172" rx="14"/>
    <rect x="292" y="196" width="28" height="100" rx="14"/>
    <rect x="340" y="226" width="28" height="40" rx="14" fill="#f2a516"/>
